<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdmiraNext — Business Plan Builder</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --ink:#0e1a24; --muted:#5b6b78; --line:#dbe4ec; --line2:#eef3f8;
    --accent:#0E7CC4; --accent2:#0a5b8f; --gold:#C8922A; --soft:#f4f8fc; --soft2:#eaf2f9;
    --ok:#1f8a52; --bg:#f7fafd;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;}
  a{color:var(--accent);}
  .app{display:grid;grid-template-columns:380px 1fr;min-height:100vh;}
  .form{background:#fff;border-right:1px solid var(--line);padding:0 0 40px;overflow-y:auto;height:100vh;position:sticky;top:0;}
  .form .head{position:sticky;top:0;background:linear-gradient(160deg,#0b1722,#0a5b8f);color:#fff;padding:14px 18px;z-index:5;}
  .form .head h1{font-size:16px;margin:0;letter-spacing:-.2px;}
  .form .head p{margin:4px 0 0;font-size:11.5px;color:#bfe0f5;}
  .langs{display:flex;gap:5px;margin-top:10px;}
  .langs button{flex:1;border:1px solid #2f7bb0;background:#0e2troops;background:#0d2438;color:#cfe6f6;border-radius:6px;padding:5px 4px;font-size:11.5px;cursor:pointer;font-weight:700;}
  .langs button.active{background:#fff;border-color:#fff;color:#0a5b8f;}
  .scenarios{display:flex;gap:6px;margin-top:8px;}
  .scenarios button{flex:1;border:1px solid #2f7bb0;background:#103048;color:#cfe6f6;border-radius:7px;padding:7px 4px;font-size:11.5px;cursor:pointer;font-weight:600;}
  .scenarios button.active{background:var(--gold);border-color:var(--gold);color:#2a1e05;}
  .grp{padding:14px 18px 4px;border-bottom:1px solid var(--line2);}
  .grp h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--accent2);margin:0 0 8px;}
  .fld{margin-bottom:9px;}
  .fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px;}
  .fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);}
  .fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--soft2);}
  .fld textarea{resize:vertical;min-height:46px;}
  .row{display:flex;gap:8px;} .row .fld{flex:1;}
  .hint{font-size:10.5px;color:#93a3b0;margin-top:2px;}
  .actions{padding:14px 18px;display:flex;gap:8px;flex-wrap:wrap;}
  .btn{border:none;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.ghost{background:var(--soft);color:var(--accent2);border:1px solid var(--line);}
  .saved{font-size:11px;color:var(--ok);padding:0 18px;height:14px;}
  .planwrap{padding:26px 30px 80px;overflow-y:auto;height:100vh;}
  .paper{max-width:820px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 30px rgba(16,40,60,.06);}
  .cover{background:linear-gradient(160deg,#0b1722 0%,#10293c 55%,#0a5b8f 100%);color:#eaf2f8;border-radius:10px 10px 0 0;padding:34px 38px;}
  .cover .k{letter-spacing:3px;text-transform:uppercase;font-size:10px;color:#7fc3ef;}
  .cover h1{font-size:40px;margin:8px 0 0;color:#fff;letter-spacing:-1px;}
  .cover .sub{font-size:15px;color:#bfe0f5;margin-top:4px;}
  .cover .tag{font-style:italic;color:#e9c987;margin-top:14px;font-size:13px;}
  .cover .meta{margin-top:20px;font-size:12px;color:#cfe0ed;line-height:1.7;}
  .cover .meta b{color:#fff;}
  .body{padding:26px 38px 36px;}
  .sec{margin:0 0 20px;}
  .sec h2{font-size:18px;margin:0 0 7px;padding-bottom:6px;border-bottom:2px solid var(--accent);}
  .sec h2 .n{color:var(--accent);margin-right:8px;font-weight:800;}
  .sec h3{font-size:14px;color:var(--accent2);margin:13px 0 3px;}
  .lead{color:var(--muted);font-size:15px;}
  .pillars{display:flex;gap:10px;margin:10px 0;}
  .pillar{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--soft);}
  .pillar h4{margin:0 0 3px;font-size:13px;color:var(--accent2);}
  .pillar .eng{font-size:10.5px;color:var(--muted);}
  .pillar p{font-size:12px;margin:5px 0 0;}
  table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;}
  th{background:var(--soft);color:var(--accent2);}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  .kpis{display:flex;gap:10px;margin:10px 0;}
  .kpi{flex:1;border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center;background:#fff;}
  .kpi .v{font-size:21px;font-weight:800;color:var(--accent2);}
  .kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
  .muted{color:var(--muted);} .tbd{color:#9a3b2f;font-style:italic;}
  ul{margin:6px 0;padding-left:18px;} li{margin:3px 0;}
  @media print{
    .form{display:none;} .app{display:block;}
    .planwrap{padding:0;height:auto;overflow:visible;}
    .paper{border:none;box-shadow:none;max-width:none;}
    @page{size:A4;margin:14mm;}
    .sec{page-break-inside:avoid;}
    .cover,.pillar,th,.kpi{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
  @media(max-width:900px){ .app{grid-template-columns:1fr;} .form{height:auto;position:static;} .planwrap{height:auto;} }
</style>
</head>
<body>
<div class="app">
  <aside class="form">
    <div class="head">
      <h1 data-i="app_title">AdmiraNext · Business Plan Builder</h1>
      <p data-i="intro"></p>
      <div class="langs" id="langs">
        <button data-l="es">Español</button>
        <button data-l="en">English</button>
        <button data-l="zh">中文</button>
      </div>
      <div class="scenarios" id="scenarios">
        <button data-s="cons" data-i="sc_cons"></button>
        <button data-s="base" class="active" data-i="sc_base"></button>
        <button data-s="agr" data-i="sc_agr"></button>
      </div>
    </div>
    <div class="saved" id="saved"></div>

    <div class="grp">
      <h2 data-i="g_company"></h2>
      <div class="fld"><label data-i="l_company"></label><input id="company"></div>
      <div class="row">
        <div class="fld"><label data-i="l_founder"></label><input id="founder"></div>
        <div class="fld"><label data-i="l_email"></label><input id="email"></div>
      </div>
      <div class="row">
        <div class="fld"><label data-i="l_nationality"></label><input id="nationality"></div>
        <div class="fld"><label data-i="l_stage"></label><select id="stage"></select></div>
      </div>
      <div class="fld"><label data-i="l_regdate"></label><input id="regdate" data-iph="ph_date"></div>
    </div>

    <div class="grp">
      <h2 data-i="g_team"></h2>
      <div class="fld"><label data-i="l_team"></label><textarea id="team" rows="3"></textarea></div>
      <div class="fld"><label data-i="l_overseas"></label><select id="overseas"></select></div>
      <div class="fld"><label data-i="l_overseasdetail"></label><input id="overseasdetail" data-iph="ph_overseas"></div>
    </div>

    <div class="grp">
      <h2 data-i="g_market"></h2>
      <div class="row">
        <div class="fld"><label data-i="l_tam"></label><input id="tam" data-iph="ph_tam"></div>
        <div class="fld"><label data-i="l_sam"></label><input id="sam" data-iph="ph_sam"></div>
        <div class="fld"><label data-i="l_som"></label><input id="som" data-iph="ph_som"></div>
      </div>
      <div class="hint" data-i="market_hint"></div>
    </div>

    <div class="grp">
      <h2 data-i="g_finance"></h2>
      <div class="row">
        <div class="fld"><label data-i="l_cur"></label><input id="cur" value="€"></div>
        <div class="fld"><label data-i="l_stores"></label><input id="stores" type="number"></div>
      </div>
      <div class="row">
        <div class="fld"><label data-i="l_screens"></label><input id="screens" type="number"></div>
        <div class="fld"><label data-i="l_imps"></label><input id="imps" type="number"></div>
      </div>
      <div class="row">
        <div class="fld"><label data-i="l_cpm"></label><input id="cpm" type="number" step="0.1"></div>
        <div class="fld"><label data-i="l_fill"></label><input id="fill" type="number"></div>
      </div>
      <div class="row">
        <div class="fld"><label data-i="l_days"></label><input id="days" type="number"></div>
        <div class="fld"><label data-i="l_saas"></label><input id="saas" type="number"></div>
      </div>
      <div class="row">
        <div class="fld"><label data-i="l_g2"></label><input id="g2" type="number" step="0.1"></div>
        <div class="fld"><label data-i="l_g3"></label><input id="g3" type="number" step="0.1"></div>
      </div>
    </div>

    <div class="grp">
      <h2 data-i="g_traction"></h2>
      <div class="row">
        <div class="fld"><label data-i="l_tstores"></label><input id="t_stores" data-iph="ph_3"></div>
        <div class="fld"><label data-i="l_tscreens"></label><input id="t_screens" data-iph="ph_40"></div>
      </div>
      <div class="fld"><label data-i="l_tkpi"></label><input id="t_kpi" data-iph="ph_free"></div>
    </div>

    <div class="grp">
      <h2 data-i="g_ask"></h2>
      <div class="fld"><label data-i="l_ask"></label><input id="ask" data-iph="ph_ask"></div>
      <div class="fld"><label data-i="l_askuse"></label><textarea id="askuse" rows="2"></textarea></div>
      <div class="fld"><label data-i="l_robo3"></label><input id="robo3" value="MagicLab"></div>
    </div>

    <div class="actions">
      <button class="btn primary" id="exportBtn" onclick="window.print()"></button>
      <button class="btn ghost" id="reset"></button>
    </div>
  </aside>

  <main class="planwrap">
    <div class="paper">
      <div class="cover">
        <div class="k" data-i="cover_k"></div>
        <h1>AdmiraNext</h1>
        <div class="sub" data-i="cover_sub"></div>
        <div class="tag" data-i="cover_tag"></div>
        <div class="meta" id="covermeta"></div>
      </div>
      <div class="body" id="plan"></div>
    </div>
  </main>
</div>

/* scenarios: language-independent numeric expectations */
const SCEN = {
  cons:{stores:25,screens:6,imps:4000,cpm:3,fill:35,days:350,saas:120,g2:1.8,g3:1.6,ask:"€400k",tam:"€12B",sam:"€1.5B",som:"€15M"},
  base:{stores:60,screens:8,imps:6000,cpm:5,fill:50,days:360,saas:180,g2:2.5,g3:2.0,ask:"€750k",tam:"€20B",sam:"€3B",som:"€45M"},
  agr:{stores:120,screens:10,imps:9000,cpm:7,fill:65,days:365,saas:240,g2:3.2,g3:2.6,ask:"€1.5M",tam:"€28B",sam:"€5B",som:"€90M"}
};
const DEFAULTS = Object.assign({
  company:"Admira Digital Networks", founder:"Carlos Silva", email:"csilva@admira.com",
  nationality:"España", stageIdx:1, regdate:"", team:"Carlos Silva — Founder & CEO", overseasIdx:0, overseasdetail:"",
  cur:"€", t_stores:"", t_screens:"", t_kpi:"", ask:"€750k",
  askuse:"Baoshan pilot: deploy the full loop (studio→store→app) on a retail network and prove measurable retail-media revenue; localization; first hires.",
  robo3:"MagicLab"
}, SCEN.base);

const TEXT_IDS=["company","founder","email","nationality","regdate","team","overseasdetail","tam","sam","som","cur","stores","screens","imps","cpm","fill","days","saas","g2","g3","t_stores","t_screens","t_kpi","ask","askuse","robo3"];
const KEY="admiranext_bp_v1", LKEY="admiranext_bp_lang";
let state={}, lang="es";
const t=k=>I18N[lang][k];

function load(){ try{state=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){state={};}
  state=Object.assign({},DEFAULTS,state);
  lang=localStorage.getItem(LKEY)||"es"; document.documentElement.lang=lang;
}
function paintUI(){
  document.querySelectorAll("[data-i]").forEach(el=>{ const v=t(el.dataset.i); if(v!=null) el.textContent=v; });
  document.querySelectorAll("[data-iph]").forEach(el=>{ const v=t(el.dataset.iph); if(v!=null) el.placeholder=v; });
  // selects
  const st=document.getElementById("stage"); st.innerHTML=t("stage").map((o,i)=>`<option value="${i}">${o}</option>`).join(""); st.value=state.stageIdx??1;
  const ov=document.getElementById("overseas"); ov.innerHTML=t("yesno").map((o,i)=>`<option value="${i}">${o}</option>`).join(""); ov.value=state.overseasIdx??0;
  // text inputs
  TEXT_IDS.forEach(id=>{const el=document.getElementById(id); if(el) el.value=state[id]??"";});
  document.querySelectorAll("#langs button").forEach(b=>b.classList.toggle("active",b.dataset.l===lang));
}
function readForm(){
  TEXT_IDS.forEach(id=>{const el=document.getElementById(id); if(el) state[id]=el.value;});
  state.stageIdx=+document.getElementById("stage").value;
  state.overseasIdx=+document.getElementById("overseas").value;
}
function save(){ localStorage.setItem(KEY,JSON.stringify(state)); localStorage.setItem(LKEY,lang);
  const s=document.getElementById("saved"); s.textContent=t("saved"); clearTimeout(window._st); window._st=setTimeout(()=>s.textContent="",1200);}
function money(n,cur){ if(!isFinite(n))return"—"; let v=Math.round(n);
  if(Math.abs(v)>=1e6) return (cur||"€")+(v/1e6).toLocaleString("en-US",{maximumFractionDigits:2})+"M";
  if(Math.abs(v)>=1e3) return (cur||"€")+(v/1e3).toLocaleString("en-US",{maximumFractionDigits:0})+"k";
  return (cur||"€")+v.toLocaleString("en-US"); }
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function orTBD(v){return (v&&String(v).trim())?esc(v):`<span class="tbd">${t("tbd")}</span>`;}
function compute(){ const n=id=>parseFloat(state[id])||0; const cur=state.cur||"€";
  const mediaY1=n("stores")*n("screens")*n("imps")*n("days")*(n("cpm")/1000)*(n("fill")/100);
  const saasY1=n("stores")*n("saas")*12; const y1=mediaY1+saasY1; const g2=n("g2")||1,g3=n("g3")||1;
  return {cur,mediaY1,saasY1,y1,y2:y1*g2,y3:y1*g3*g2,m2:mediaY1*g2,m3:mediaY1*g2*g3,sa2:saasY1*g2,sa3:saasY1*g2*g3}; }

function pillar(a){return `<div class="pillar"><h4>${a[0]}</h4><div class="eng">${a[1]}</div><p>${a[2]}</p></div>`;}

function render(){
  const f=compute(), cur=f.cur;
  const stageTxt=t("stage")[state.stageIdx??1], overTxt=t("yesno")[state.overseasIdx??0];
  document.getElementById("covermeta").innerHTML=
    `<b>${t("m_company")}:</b> ${orTBD(state.company)} &nbsp;·&nbsp; <b>${t("m_founder")}:</b> ${orTBD(state.founder)}<br>`+
    `<b>${t("m_for")}:</b> ${t("m_for_v")}<br>`+
    `<b>${t("m_track")}:</b> ${t("m_track_v")}<br>`+
    `<b>${t("m_contact")}:</b> ${orTBD(state.email)}`;
  const teamHtml=(state.team||"").trim()
    ? "<ul>"+state.team.split("\n").filter(x=>x.trim()).map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"
    : `<p class="tbd">${t("s8_team_tbd")}</p>`;
  document.getElementById("plan").innerHTML=`
  <div class="sec"><h2><span class="n">1</span>${t("s1")}</h2><p class="lead">${t("s1_lead")}</p><p>${t("s1_p")}</p></div>
  <div class="sec"><h2><span class="n">2</span>${t("s2")}</h2><ul>${t("s2_li").map(x=>"<li>"+x+"</li>").join("")}</ul></div>
  <div class="sec"><h2><span class="n">3</span>${t("s3")}</h2>
    <h3>${t("s3_h1")}</h3>
    <div class="pillars">${pillar(t("p_studio"))}${pillar(t("p_store"))}${pillar(t("p_app"))}</div>
    <h3>${t("s3_h2")}</h3><p>${t("s3_p2")}</p></div>
  <div class="sec"><h2><span class="n">4</span>${t("s4")}</h2>
    <div class="kpis">
      <div class="kpi"><div class="v">${orTBD(state.tam)}</div><div class="l">${t("k_tam")}</div></div>
      <div class="kpi"><div class="v">${orTBD(state.sam)}</div><div class="l">${t("k_sam")}</div></div>
      <div class="kpi"><div class="v">${orTBD(state.som)}</div><div class="l">${t("k_som")}</div></div>
    </div><p>${t("s4_p").replace("{ROBO3}",orTBD(state.robo3))}</p></div>
  <div class="sec"><h2><span class="n">5</span>${t("s5")}</h2><p class="muted">${t("s5_note")}</p>
    <table>
      <tr><th>${t("t_line")}</th><th class="num">${t("t_y1")}</th><th class="num">${t("t_y2")}</th><th class="num">${t("t_y3")}</th></tr>
      <tr><td>${t("t_media")}</td><td class="num">${money(f.mediaY1,cur)}</td><td class="num">${money(f.m2,cur)}</td><td class="num">${money(f.m3,cur)}</td></tr>
      <tr><td>${t("t_saas")}</td><td class="num">${money(f.saasY1,cur)}</td><td class="num">${money(f.sa2,cur)}</td><td class="num">${money(f.sa3,cur)}</td></tr>
      <tr><th>${t("t_total")}</th><th class="num">${money(f.y1,cur)}</th><th class="num">${money(f.y2,cur)}</th><th class="num">${money(f.y3,cur)}</th></tr>
    </table><p class="muted">${t("s5_after")}</p></div>
  <div class="sec"><h2><span class="n">6</span>${t("s6")}</h2><ul>${t("s6_li").map(x=>"<li>"+x+"</li>").join("")}</ul></div>
  <div class="sec"><h2><span class="n">7</span>${t("s7")}</h2>
    <div class="kpis">
      <div class="kpi"><div class="v">${orTBD(state.t_stores)}</div><div class="l">${t("k_tstores")}</div></div>
      <div class="kpi"><div class="v">${orTBD(state.t_screens)}</div><div class="l">${t("k_tscreens")}</div></div>
      <div class="kpi"><div class="v">3/3</div><div class="l">${t("k_prod")}</div></div>
    </div><p>${state.t_kpi?esc(state.t_kpi):t("s7_default")}</p></div>
  <div class="sec"><h2><span class="n">8</span>${t("s8")}</h2>${teamHtml}
    <p class="muted">${t("s8_overseas")} <b>${esc(overTxt)}</b>${state.overseasdetail?" — "+esc(state.overseasdetail):""}.</p></div>
  <div class="sec"><h2><span class="n">9</span>${t("s9")}</h2>
    <div class="kpis">
      <div class="kpi"><div class="v">${orTBD(state.ask)}</div><div class="l">${t("k_fund")}</div></div>
      <div class="kpi"><div class="v">${esc(stageTxt)}</div><div class="l">${t("k_stage")}</div></div>
      <div class="kpi"><div class="v">${orTBD(state.regdate)}</div><div class="l">${t("k_reg")}</div></div>
    </div><p><b>${t("s9_use")}</b> ${orTBD(state.askuse)}</p>
    <p class="muted">${t("s9_meta").replace("{C}",orTBD(state.company))}</p></div>`;
}

function tick(){ readForm(); save(); render(); }
function setLang(l){ readForm(); lang=l; document.documentElement.lang=l; save(); paintUI(); render(); }
function setScenario(s){ readForm(); Object.assign(state,SCEN[s]);
  document.querySelectorAll("#scenarios button").forEach(b=>b.classList.toggle("active",b.dataset.s===s));
  TEXT_IDS.forEach(id=>{const el=document.getElementById(id); if(el&&id in state) el.value=state[id];});
  save(); render(); }

document.addEventListener("DOMContentLoaded",()=>{
  load(); paintUI(); render();
  TEXT_IDS.forEach(id=>{const el=document.getElementById(id); if(el) el.addEventListener("input",tick);});
  document.getElementById("stage").addEventListener("change",tick);
  document.getElementById("overseas").addEventListener("change",tick);
  document.querySelectorAll("#langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
  document.querySelectorAll("#scenarios button").forEach(b=>b.addEventListener("click",()=>setScenario(b.dataset.s)));
  document.getElementById("reset").addEventListener("click",()=>{ if(confirm("Reset → Base?")){ localStorage.removeItem(KEY); state=Object.assign({},DEFAULTS); paintUI(); render(); }});
});
</script>
