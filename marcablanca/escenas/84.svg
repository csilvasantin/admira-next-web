<title id="t84">Piel 84 · ojo rojo encendido en una cabeza metálica de robot sobre la ciudad de noche</title>
<desc id="d84">Cabeza de robot de facetas cromadas en penumbra, con un sensor rojo encendido y una retícula de visor, sobre el perfil de una ciudad nocturna con líneas de barrido y una moto solitaria en la autopista. Ilustración vectorial original de Admira para la piel de ejemplo 84: sin fotogramas, carteles, logotipos, títulos ni personajes de terceros.</desc>
