<title id="t89">Piel 89 · haz de un reflector con silueta alada proyectado en las nubes sobre un horizonte gótico</title>
<desc id="d89">Noche cerrada sobre una ciudad de agujas y arcos góticos con ventanas doradas; desde una azotea, un reflector proyecta en las nubes un óvalo amarillo con una silueta de alas nocturnas. Ilustración vectorial original de Admira para la piel de ejemplo 89: sin fotogramas, carteles, logotipos, títulos ni personajes de terceros.</desc>
