<title id="t88">Piel 88 · guante blanco de dibujo animado y farola de cine negro en una ciudad de los años 40</title>
<desc id="d88">Calle de noche al estilo de los años 40 en Los Ángeles: torre escalonada art déco, palmeras, un coche de época y una farola de hierro con su cono de luz; en primer plano asoma una mano de dibujo animado con guante blanco que saluda. Ilustración vectorial original de Admira para la piel de ejemplo 88: sin fotogramas, carteles, logotipos, títulos ni personajes de terceros.</desc>
