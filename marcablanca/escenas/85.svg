<title id="t85">Piel 85 · coche de puertas de ala de gaviota con huellas de fuego ante una torre del reloj</title>
<desc id="d85">Noche violeta con un rayo eléctrico sobre la aguja de una torre del reloj; en la calle, un coche de acero con las puertas abiertas hacia arriba como alas, y dos huellas de neumático en llamas que se pierden hacia el espectador. Ilustración vectorial original de Admira para la piel de ejemplo 85: sin fotogramas, carteles, logotipos, títulos ni personajes de terceros.</desc>
