<title id="t86">Piel 86 · dos cazas cruzándose al atardecer sobre la cubierta de un portaaviones</title>
<desc id="d86">Atardecer naranja y oro sobre el mar, el sol en el horizonte y, en primer plano, la cubierta de un portaaviones con sus marcas y la isla de mando; en el cielo, dos cazas cruzan sus estelas formando una X. Ilustración vectorial original de Admira para la piel de ejemplo 86: sin fotogramas, carteles, logotipos, títulos ni personajes de terceros.</desc>
