<title id="t83">Piel 83 · bicicleta con cesta cruzando la luna llena sobre los pinos</title>
<desc id="d83">Cielo nocturno estrellado, una luna llena enorme y, a contraluz, la silueta de una bicicleta con cesta y su ciclista volando sobre un bosque de pinos; luces cálidas del barrio en el horizonte. Ilustración vectorial original de Admira para la piel de ejemplo 83: sin fotogramas, carteles, logotipos, títulos ni personajes de terceros.</desc>
