<title id="t87">Piel 87 · visor de un casco policial cromado con una línea de HUD</title>
<desc id="d87">Casco blindado de cromo con reflejos, un visor oscuro atravesado por una línea de datos cian con su retícula y marcas, protector de mentón y hombreras, sobre una rejilla azul de patrulla. Ilustración vectorial original de Admira para la piel de ejemplo 87: sin fotogramas, carteles, logotipos, títulos ni personajes de terceros.</desc>
