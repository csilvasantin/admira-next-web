<title id="t81">Piel 81 · sombrero de ala y látigo ante la portada de un templo en el desierto</title>
<desc id="d81">Atardecer de arena con el sol bajo, una portada de templo excavada en la roca, dunas y, en primer plano sobre una piedra, un sombrero de ala ancha y un látigo enrollado. Ilustración vectorial original de Admira para la piel de ejemplo 81: sin fotogramas, carteles, logotipos, títulos ni personajes de terceros.</desc>
