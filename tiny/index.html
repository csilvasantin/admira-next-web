<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ThinkPad · Admira MCP</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="laptop">

  </section>
</main>
