<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="admiranext-version" content="AdmiraNeXT v.12.08.2026.r12.12:10">
<title>Usuarios · AdmiraNeXT</title><style>
:root{color-scheme:dark;--bg:#070b12;--panel:#101724;--line:#25344b;--ink:#eef6ff;--dim:#8ea0b8;--cyan:#63e6d5;--warn:#ffbd69;--bad:#ff6b7a;--ok:#7ff0a1;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -20%,#14332f 0,transparent 42%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}.shell{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:28px 0 64px}header{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:26px}h1{margin:4px 0;font-size:clamp(28px,4vw,44px)}.eyebrow,.meta{font:700 12px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}.meta{color:var(--dim);text-transform:none;letter-spacing:0}.actions{display:flex;gap:10px;flex-wrap:wrap}button,a.btn{border:1px solid var(--line);background:#121c2c;color:var(--ink);padding:10px 14px;border-radius:10px;text-decoration:none;font:700 13px var(--mono);cursor:pointer}button:hover,a.btn:hover{border-color:var(--cyan)}button:disabled{opacity:.45;cursor:wait}.panel{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 18px 50px #0004}.add{display:grid;grid-template-columns:1.4fr 1fr .8fr auto;gap:10px}.add input,.add select,select{width:100%;border:1px solid var(--line);background:#09111d;color:var(--ink);padding:11px;border-radius:9px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);vertical-align:middle}th{font:700 11px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.1em}.status{font:700 11px var(--mono);padding:5px 8px;border-radius:999px;border:1px solid}.active{color:var(--ok)}.suspended{color:var(--bad)}.row-actions{display:flex;gap:7px;flex-wrap:wrap}.danger{color:var(--bad)}.notice{min-height:22px;color:var(--dim);font:600 12px/1.5 var(--mono)}.notice.ok{color:var(--ok)}.notice.bad{color:var(--bad)}.audit{display:grid;gap:8px}.event{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.event time{color:var(--dim);font:12px var(--mono)}@media(max-width:760px){header{align-items:flex-start;flex-direction:column}.add{grid-template-columns:1fr}table,tbody,tr,td{display:block}thead{display:none}tr{padding:14px 0;border-bottom:1px solid var(--line)}td{border:0;padding:5px 0}.event{grid-template-columns:1fr}}
</style></head><body><main class="shell"><header><div><div class="eyebrow">AdmiraNeXT · Identidad</div><h1>Gestión de usuarios</h1><div id="who" class="meta">cargando sesión…</div></div><div class="actions"><a class="btn" href="/webmaster">← Webmaster</a><button id="logout">Cerrar sesión</button></div></header>
<section class="panel"><h2>Alta</h2><form id="add" class="add"><input name="email" type="email" required autocomplete="off" placeholder="persona@dominio.com"><input name="display_name" maxlength="100" placeholder="Nombre visible"><select name="role"><option value="viewer">Lector</option><option value="editor">Editor</option><option value="admin">Administrador</option></select><button>Dar acceso</button></form></section>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<section class="panel"><h2>Directorio</h2><div style="overflow:auto"><table><thead><tr><th>Persona</th><th>Rol</th><th>Estado</th><th>Último acceso</th><th>Sesión</th><th>Acciones</th></tr></thead><tbody id="users"></tbody></table></div></section>
<section class="panel"><h2>Auditoría</h2><div id="audit" class="audit"></div></section></main><script>
let state={csrf:'',me:'',users:[],audit:[]}; const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function when(v){return v?new Intl.DateTimeFormat('es-ES',{dateStyle:'short',timeStyle:'short'}).format(new Date(v)):'Nunca'}
function notice(t,bad=false){$('#notice').textContent=t;$('#notice').className='notice '+(bad?'bad':'ok')}
async function api(method='GET',body){const r=await fetch('/api/usuarios',{method,headers:{'content-type':'application/json','X-Admira-CSRF':state.csrf},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'No se pudo completar');return d}
function paint(){ $('#who').textContent=state.me+' · administrador'; $('#users').innerHTML=state.users.map(u=>`<tr data-email="${esc(u.email)}"><td><strong>${esc(u.display_name||u.email)}</strong><div class="meta">${esc(u.email)}</div></td><td><select data-field="role"><option value="viewer" ${u.role==='viewer'?'selected':''}>Lector</option><option value="editor" ${u.role==='editor'?'selected':''}>Editor</option><option value="admin" ${u.role==='admin'?'selected':''}>Administrador</option></select></td><td><span class="status ${esc(u.status)}">${u.status==='active'?'activo':'suspendido'}</span></td><td>${when(u.last_login_at)}</td><td class="meta">v${u.session_version}</td><td><div class="row-actions"><button data-act="toggle">${u.status==='active'?'Suspender':'Reactivar'}</button><button data-act="revoke">Cerrar sesiones</button></div></td></tr>`).join(''); $('#audit').innerHTML=state.audit.map(e=>`<div class="event"><time>${when(e.created_at)}</time><div><strong>${esc(e.action)}</strong> · ${esc(e.actor_email)} → ${esc(e.target_email)}<div class="meta">${esc(e.detail)}</div></div></div>`).join('')||'<p class="meta">Todavía no hay eventos.</p>' }
async function load(){try{const d=await api();state={...state,...d,csrf:d.current.csrf,me:d.current.email};paint()}catch(e){notice(e.message,true)}}
$('#add').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await api('POST',Object.fromEntries(f));e.currentTarget.reset();notice('Usuario dado de alta');await load()}catch(x){notice(x.message,true)}};
$('#users').onchange=async e=>{if(!e.target.matches('[data-field=role]'))return;const tr=e.target.closest('tr');try{await api('PATCH',{email:tr.dataset.email,role:e.target.value});notice('Rol actualizado; las sesiones anteriores quedan revocadas');await load()}catch(x){notice(x.message,true);await load()}};
$('#users').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const tr=b.closest('tr'),u=state.users.find(x=>x.email===tr.dataset.email);b.disabled=true;try{if(b.dataset.act==='revoke')await api('PATCH',{email:u.email,action:'revoke_sessions'});else await api('PATCH',{email:u.email,status:u.status==='active'?'suspended':'active'});notice(b.dataset.act==='revoke'?'Sesiones cerradas':'Estado actualizado');await load()}catch(x){notice(x.message,true)}finally{b.disabled=false}};
$('#logout').onclick=async()=>{try{await fetch('/webmaster/logout',{method:'POST',headers:{'X-Admira-CSRF':state.csrf}})}finally{location.href='/webmaster'}}; load();
</script></body></html>
