<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>PortAventuraNeXT · Preview</title>
<link rel="icon" href="/favicon-32.png">
<link rel="stylesheet" href="/assets/admira-frame.css?v=20261023-idioma-1">
<style>
:root{--bg:#0b0b10;--fg:#fff;--a1:#FF3366;--a2:#FFCC00;--a3:#33FF99;--a4:#FF33CC;--card:#15151d}
[data-skin=netflix]{--bg:#0a0000;--a1:#E50914;--a2:#ff6b6b;--a3:#b20710;--a4:#ffd1d1;--card:#1a0606}
[data-skin=universal]{--bg:#03101f;--a1:#3aa0ff;--a2:#ffd34d;--a3:#7fd1ff;--a4:#ffffff;--card:#0a1b30}
[data-skin=sony]{--bg:#05060f;--a1:#2d6bff;--a2:#ff2d55;--a3:#00d5ff;--a4:#b6c3ff;--card:#0e1124}
[data-skin=skydance]{--bg:#0d0b07;--a1:#ff8a00;--a2:#ffd27a;--a3:#9fb3c8;--a4:#ffffff;--card:#1c1710}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);transition:background .4s}
.logo{font-weight:800;letter-spacing:.5px}.logo b:nth-child(1){color:var(--a1)}.logo b:nth-child(2){color:var(--a2)}.logo b:nth-child(3){color:var(--a3)}.logo b:nth-child(4){color:var(--a4)}
.lang button,.skins button{background:transparent;border:1px solid #fff4;color:#fff;border-radius:999px;padding:4px 10px;cursor:pointer;margin-left:4px}
.lang button.on,.skins button.on{background:var(--a1);border-color:var(--a1)}
.hero{padding:48px 24px 24px;max-width:1100px;margin:auto}
.hero h1{font-size:clamp(2rem,6vw,4rem);margin:0 0 12px;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3),var(--a4));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:1.2rem;opacity:.85;max-width:720px}
.skins{margin-top:16px}
main{max-width:1100px;margin:auto;padding:0 24px 48px;display:grid;grid-template-columns:2fr 1fr;gap:24px}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:18px;padding:20px;border:1px solid #ffffff14}
.map{position:relative;aspect-ratio:4/3;border-radius:14px;background:radial-gradient(circle at 50% 50%,#ffffff10 0 18%,transparent 19%),linear-gradient(135deg,#ffffff08,#ffffff02)}
.zone{position:absolute;width:42%;height:38%;border-radius:22px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:700;font-size:.95rem;border:2px solid;background:#00000040}
.z0{left:5%;top:6%;border-color:var(--a1)}.z1{right:5%;top:6%;border-color:var(--a2)}.z2{left:5%;bottom:6%;border-color:var(--a3)}.z3{right:5%;bottom:6%;border-color:var(--a4)}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:2rem}
.avatar{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3rem;background:conic-gradient(var(--a1),var(--a2),var(--a3),var(--a4),var(--a1));box-shadow:0 0 30px var(--a1)}
.bubble{margin-top:14px;background:#ffffff10;border-radius:14px;padding:12px;font-size:.95rem}
a.pa-login{font-weight:700}
html.admira-con-sesion a.pa-login{display:none!important}
footer{max-width:1100px;margin:auto;padding:24px;font-size:.8rem;opacity:.65;border-top:1px solid #ffffff14}
</style>
</head>
<body data-skin="default" data-yk-cli="on" data-yk-title="PORTAVENTURA" data-yk-rail-left="OPCIONES" data-yk-rail-right="AVANZADO">
<nav data-yk-slot="nav"><a class="pa-login" href="/webmaster?return_to=/portaventura/">Login</a></nav>
<div data-yk-slot="left" data-yk-label="Marca / Brand" id="paSkinsRail"></div>
<section class="hero">
  <h1 id="title"></h1>
  <p id="pitch"></p>
  <div class="skins" id="skins"></div>
</section>
<main>
  <div class="card"><h3 id="mapTitle"></h3>
    <div class="map" id="map"><div class="hub">🎢</div></div>
  </div>
  <div class="card"><h3 id="hostTitle"></h3>
    <div class="avatar" id="avatar"></div>
    <h2 id="hostName" style="margin:12px 0 0"></h2>
    <div class="bubble" id="hostLine"></div>
  </div>
</main>
<footer id="disclaimer"></footer>
<script>
const SKINS={
 default:{emoji:'🤖',host:'Admirito Park',
  es:{t:'PortAventura NeXT',p:'El mito mediterráneo, reimaginado con Physical AI.',z:['Mediterrània Physical AI','Bosque de los Mitos','Puerto de los Robots','Cielo NeXT'],l:'¡Hola! Soy Admirito Park. Te guío por el parque y te aviso de colas y espectáculos.'},
  en:{t:'PortAventura NeXT',p:'The Mediterranean myth, reimagined with Physical AI.',z:['Mediterranean Physical AI','Forest of Myths','Robot Harbour','NeXT Sky'],l:"Hi! I'm Admirito Park. I'll guide you around the park and flag queues and shows."}},
 netflix:{emoji:'🔦',host:'Guía Upside',
  es:{t:'PortAventura × Netflix',p:'Las mismas montañas rusas, ahora en el Upside Down.',z:['Stranger Things','Wednesday','Squid Game','Casa de Papel'],l:'Bienvenido a Hawkins… o a Nevermore. Sígueme, las luces te dirán el camino.'},
  en:{t:'PortAventura × Netflix',p:'The same coasters, now in the Upside Down.',z:['Stranger Things','Wednesday','Squid Game','Money Heist'],l:'Welcome to Hawkins… or Nevermore. Follow me, the lights will show the way.'}},
 universal:{emoji:'🎬',host:'Host Universal',
  es:{t:'PortAventura × Universal',p:'Un blockbuster en cada land.',z:['Jurassic','Wizarding','Super Nintendo','Minions'],l:'¡Acción! Hoy protagonizas tu propia película. ¿Empezamos por los dinosaurios?'},
  en:{t:'PortAventura × Universal',p:'A blockbuster in every land.',z:['Jurassic','Wizarding','Super Nintendo','Minions'],l:"Action! Today you star in your own movie. Shall we start with the dinosaurs?"}},
 sony:{emoji:'🕷️',host:'Guía PlayStation',
  es:{t:'PortAventura × Sony',p:'Salta entre universos: cine, cómic y consola.',z:['Spider-Verse','Ghostbusters','Uncharted / GoW','PlayStation'],l:'Pulsa ✕ para empezar. Te llevo de multiverso en multiverso.'},
  en:{t:'PortAventura × Sony',p:'Jump across universes: film, comics and console.',z:['Spider-Verse','Ghostbusters','Uncharted / GoW','PlayStation'],l:'Press ✕ to start. I’ll take you from multiverse to multiverse.'}},
 skydance:{emoji:'✈️',host:'Maverick Ops',
  es:{t:'PortAventura × Skydance',p:'Misión: velocidad, adrenalina y máquinas.',z:['Top Gun','Mission Impossible','Transformers','Tomorrow Zone'],l:'Aquí operaciones. Tu misión, si decides aceptarla: todas las atracciones antes de comer.'},
  en:{t:'PortAventura × Skydance',p:'Mission: speed, adrenaline and machines.',z:['Top Gun','Mission Impossible','Transformers','Tomorrow Zone'],l:'Ops here. Your mission, should you choose to accept it: every ride before lunch.'}}
};
const UI={es:{map:'Mapa del parque (esquema)',host:'Tu anfitrión',disc:'Conceptos ilustrativos. No existe acuerdo con los titulares de las marcas o propiedades intelectuales mostradas. Preview interna de AdmiraNeXT.',help:'Comandos: /marca|/brand <default|netflix|universal|sony|skydance> · /idioma|/language <es|en>'},
 en:{map:'Park map (schematic)',host:'Your host',disc:'Illustrative concepts. No agreement exists with the owners of the brands or IP shown. AdmiraNeXT internal preview.',help:'Commands: /marca|/brand <default|netflix|universal|sony|skydance> · /idioma|/language <es|en>'}};
const q=new URLSearchParams(location.search);
let skin=SKINS[q.get('marca')||q.get('brand')]?(q.get('marca')||q.get('brand')):(localStorage.getItem('pa_skin')||'default');
let lang=q.get('lang')||localStorage.getItem('admiranext_lang')||'es';if(!UI[lang])lang='es';if(!SKINS[skin])skin='default';
const $=id=>document.getElementById(id);
function render(){const s=SKINS[skin],c=s[lang];document.body.dataset.skin=skin;document.documentElement.lang=lang;
 $('title').textContent=c.t;$('pitch').textContent=c.p;$('mapTitle').textContent=UI[lang].map;$('hostTitle').textContent=UI[lang].host;
 $('avatar').textContent=s.emoji;$('hostName').textContent=s.host;$('hostLine').textContent=c.l;$('disclaimer').innerHTML=UI.es.disc+'<br>'+UI.en.disc;
 const m=$('map');m.querySelectorAll('.zone').forEach(e=>e.remove());c.z.forEach((z,i)=>{const d=document.createElement('div');d.className='zone z'+i;d.textContent=z;m.appendChild(d)});
 $('skins').innerHTML=Object.keys(SKINS).map(k=>`<button data-skin="${k}" class="${k===skin?'on':''}">${k}</button>`).join('');
 const r=$('paSkinsRail');if(r)r.innerHTML=Object.keys(SKINS).map(k=>`<button data-skin="${k}" class="${k===skin?'on':''}">${k}</button>`).join(' ');}
function setSkin(k){if(!SKINS[k])return false;skin=k;localStorage.setItem('pa_skin',k);render();return true}
function setLang(l){if(!UI[l])return false;lang=l;try{localStorage.setItem('admiranext_lang',l);localStorage.setItem('admiranext_expert_lang',l)}catch(e){}render();return true}
window.setLang=setLang;
document.addEventListener('click',e=>{const b=e.target.closest('button[data-skin]');if(b)setSkin(b.dataset.skin)});
// /marca /brand con las pieles PortAventura en el ⌘ Experto real (y en el CLI del armazón).
function paMarca(a,out){const k=String((a&&a[0])||'').toLowerCase();const ok=setSkin(k);const t=ok?'✓ PortAventura · '+k:UI[lang].help;
 if(out&&out.appendChild){const d=document.createElement('div');d.className='yk-cli-line';d.textContent=t;out.appendChild(d)}return {ok:ok}}
function paFrame(){const F=window.AdmiraFrame;if(F&&F.verbo)F.verbo({id:'marca',aliases:['brand'],uso:Object.keys(SKINS).join('|'),ayuda:'Piel PortAventura',ayudaEn:'PortAventura skin',run:(a,ctx)=>{const r=paMarca(a);ctx.imprimir(r.ok?'✓ '+skin:UI[lang].help)}});
 if(F&&F.verbo)F.verbo({id:'idioma',aliases:['language','lang'],uso:'es|en',ayuda:'Idioma de la página',ayudaEn:'Page language',run:(a,ctx)=>{const l=String((a&&a[0])||'').toLowerCase();if(!setLang(l))return ctx.imprimir(UI[lang].help);const X=window.AdmiraExperto;try{if(X&&X.setLanguage)X.setLanguage(l)}catch(e){}document.documentElement.lang=l;ctx.imprimir(l==='en'?'Language: English':'Idioma: español')}})}
function paLogin(){const a=document.querySelector('a.pa-login'),l=document.getElementById('ykLangPre');if(a&&l&&a.nextSibling!==l)l.parentNode.insertBefore(a,l)}
document.addEventListener('admira-frame:ready',()=>{paFrame();paLogin()});
new MutationObserver(()=>{const l=(document.documentElement.lang||'es').slice(0,2);if(UI[l]&&l!==lang)setLang(l)}).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
let paN=0;const paT=setInterval(()=>{const X=window.AdmiraExperto;if(X&&X.verb){X.verb({name:'marca',alias:['brand'],args:Object.keys(SKINS).join('|'),desc:['piel PortAventura: '+Object.keys(SKINS).join(', '),'PortAventura skin: '+Object.keys(SKINS).join(', ')],run:(a,log)=>paMarca(a,log)});clearInterval(paT)}else if(++paN>60)clearInterval(paT)},250);
render();
</script>
<script defer src="/assets/admira-frame.js?v=20261023-idioma-1"></script>
</body>
</html>
