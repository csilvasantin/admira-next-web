  <rect x="145" y="690" width="1320" height="170" rx="28" fill="#002e72"/>
  <circle cx="212" cy="775" r="32" fill="#00a4d6"/><circle cx="212" cy="828" r="15" fill="#ef4135"/><circle cx="250" cy="820" r="12" fill="#ffc400"/>
  <text x="305" y="758" fill="white" font-family="Arial, sans-serif" font-weight="800" font-size="37">Un piloto, una oficina, dos recorridos</text>
  <text x="305" y="813" fill="#bdd5ef" font-family="Arial, sans-serif" font-size="25">Brief → contenido → emisión → contexto → medición → siguiente decisión.</text>
  <text x="1450" y="914" text-anchor="end" fill="#7186a8" font-family="Arial, sans-serif" font-size="18">ADmiraNeXT · 16.07.2026</text>
