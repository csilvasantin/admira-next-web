<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Ecosistema Admira per a CaixaBank</title>
  <desc id="desc">Flux tancat que crea, emet, entén i mesura l'espai físic d'una oficina CaixaBank.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#002e72"/><stop offset="1" stop-color="#001a44"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00a4d6"/><stop offset=".55" stop-color="#0a78b1"/><stop offset="1" stop-color="#ffc400"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#f4f8fc"/><rect x="56" y="52" width="1488" height="896" rx="42" fill="white" filter="url(#shadow)"/><rect x="56" y="52" width="1488" height="230" rx="42" fill="url(#bg)"/><rect x="56" y="238" width="1488" height="44" fill="url(#bg)"/>
  <text x="120" y="126" fill="#78c9ec" font-family="Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="6">ADMIRA × CAIXABANK</text><text x="120" y="205" fill="white" font-family="Arial, sans-serif" font-weight="800" font-size="58">L'oficina com a mitjà intel·ligent</text><text x="120" y="252" fill="#bdd5ef" font-family="Arial, sans-serif" font-size="25">Un cicle operatiu que connecta marca, pantalles, espai i dada.</text>
  <path d="M310 515 C430 365 610 360 760 475 C910 590 1080 610 1290 470" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round"/><path d="M1263 440 L1310 465 L1274 505" fill="none" stroke="#ffc400" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(145 365)"><rect width="300" height="250" rx="28" fill="#eef7fb" stroke="#b9ddec" stroke-width="3"/><circle cx="55" cy="56" r="27" fill="#00a4d6"/><text x="55" y="65" text-anchor="middle" fill="white" font-size="24" font-weight="800">01</text><text x="38" y="125" fill="#002e72" font-size="36" font-weight="800">Crear</text><text x="38" y="164" fill="#007eae" font-size="22" font-weight="700">PIXERIA</text><text x="38" y="205" fill="#3c5580" font-size="20">Brífing + marca</text><text x="38" y="233" fill="#3c5580" font-size="20">Variants per context</text></g>
    <g transform="translate(485 365)"><rect width="300" height="250" rx="28" fill="#f3f7fc" stroke="#cbd9eb" stroke-width="3"/><circle cx="55" cy="56" r="27" fill="#087ab2"/><text x="55" y="65" text-anchor="middle" fill="white" font-size="24" font-weight="800">02</text><text x="38" y="125" fill="#002e72" font-size="36" font-weight="800">Emetre</text><text x="38" y="164" fill="#007eae" font-size="22" font-weight="700">ADMIRA.TV</text><text x="38" y="205" fill="#3c5580" font-size="20">Canals i pantalles</text><text x="38" y="233" fill="#3c5580" font-size="20">Prova d'emissió</text></g>
    <g transform="translate(825 365)"><rect width="300" height="250" rx="28" fill="#f3f7fc" stroke="#cbd9eb" stroke-width="3"/><circle cx="55" cy="56" r="27" fill="#005b80"/><text x="55" y="65" text-anchor="middle" fill="white" font-size="24" font-weight="800">03</text><text x="38" y="125" fill="#002e72" font-size="36" font-weight="800">Entendre</text><text x="38" y="164" fill="#007eae" font-size="22" font-weight="700">XPACEOS</text><text x="38" y="205" fill="#3c5580" font-size="20">Bessó digital</text><text x="38" y="233" fill="#3c5580" font-size="20">Regles de l'espai</text></g>
    <g transform="translate(1165 365)"><rect width="300" height="250" rx="28" fill="#fff9e6" stroke="#f3d477" stroke-width="3"/><circle cx="55" cy="56" r="27" fill="#ffc400"/><text x="55" y="65" text-anchor="middle" fill="#002e72" font-size="24" font-weight="800">04</text><text x="38" y="125" fill="#002e72" font-size="36" font-weight="800">Mesurar</text><text x="38" y="164" fill="#a65b00" font-size="22" font-weight="700">OMNIPUBLICITY</text><text x="38" y="205" fill="#3c5580" font-size="20">Audiència i atribució</text><text x="38" y="233" fill="#3c5580" font-size="20">Dada que optimitza</text></g>
  </g>
  <rect x="145" y="690" width="1320" height="170" rx="28" fill="#002e72"/><circle cx="212" cy="775" r="32" fill="#00a4d6"/><circle cx="212" cy="828" r="15" fill="#ef4135"/><circle cx="250" cy="820" r="12" fill="#ffc400"/><text x="305" y="758" fill="white" font-family="Arial, sans-serif" font-weight="800" font-size="37">Un pilot, una oficina, dos recorreguts</text><text x="305" y="813" fill="#bdd5ef" font-family="Arial, sans-serif" font-size="25">Brífing → contingut → emissió → context → mesurament → decisió següent.</text><text x="1450" y="914" text-anchor="end" fill="#7186a8" font-family="Arial, sans-serif" font-size="18">AdmiraNeXT · 17.07.2026</text>
</svg>
