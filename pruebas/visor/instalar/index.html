<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="application-name" content="Admira Visor">
<title>Admira Visor · añadir a las gafas</title>
<style>
  html, body { margin: 0; width: 100%; height: 600px; max-width: 600px; max-height: 600px; overflow: hidden; background: #000; color: #f4f7ff; font-family: system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  main { width: 100%; box-sizing: border-box; padding: 20px 24px; text-align: center; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p { font-size: 16px; line-height: 1.35; color: #d5d5d5; }
  img { width: 220px; height: 220px; background: #fff; padding: 10px; }
  button { margin-top: 12px; min-height: 48px; padding: 0 16px; border: 2px solid #9eb6ff; border-radius: 12px; background: transparent; color: #fff; font: 700 16px system-ui, sans-serif; }
  button:focus, button.focused { outline: none; box-shadow: 0 0 0 3px #9eb6ff; }
  .url { margin: 10px 0 0; font-size: 11px; line-height: 1.35; word-break: break-all; color: #8d8d8d; }
</style>
</head>
<body>
<main>
  <h1>Admira Visor</h1>
  <p>Mira este código con las Ray-Ban Display. Es el enlace de instalar, no la dirección de la página sola. El enlace que abre el gate lo crea el personal en /pruebas/visor-enlace/.</p>
  <img src="/pruebas/visor/instalar/qr-gafas.png" width="220" height="220" alt="QR para añadir Admira Visor a las gafas">
  <button type="button" id="copiar" class="focused" autofocus>Copiar enlace</button>
  <p class="url" id="enlace"></p>
</main>
<script>
  var nodo = document.getElementById('enlace');
  var texto = '';
  fetch('/pruebas/visor/instalar/enlace.txt').then(function (r) { return r.text(); }).then(function (t) {
    texto = t.trim();
    nodo.textContent = texto;
  });
  document.getElementById('copiar').focus();
  document.getElementById('copiar').addEventListener('click', function () {
    var hecho = function () { nodo.textContent = texto; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(hecho).catch(hecho);
    else hecho();
  });
</script>
</body>
</html>
