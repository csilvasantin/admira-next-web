<script>
/* El lang sigue ?lang= y admira:languagechange. El atributo inicial es solo el respaldo sin script. */
(function () {
  function aplicar(l) { if (l === 'en' || l === 'es') document.documentElement.lang = l; }
  try {
    var q = new URLSearchParams(location.search).get('lang') || '';
    if (/^en/i.test(q)) aplicar('en');
    else if (/^es/i.test(q)) aplicar('es');
  } catch (e) {}
  window.addEventListener('admira:languagechange', function (ev) {
    var l = ev && ev.detail && ev.detail.lang;
    aplicar(l === 'en' || l === 'es' ? l : null);
  });
})();
</script>
